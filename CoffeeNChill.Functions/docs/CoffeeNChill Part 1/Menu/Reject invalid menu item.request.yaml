$kind: http-request
url: "{{baseUrl}}/menu"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "partitionKey": "",
      "rowKey": "BAD-001",
      "name": "",
      "price": -1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 400 Bad Request', function () { pm.response.to.have.status(400); });
      pm.test('returns structured error', function () { pm.expect(pm.response.json().error).to.be.a('string'); });
    language: text/javascript
order: 6000
